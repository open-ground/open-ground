# ==================== 基础模块错误码映射 ====================
# 格式: <内部码>.target=<映射后的外部码>
# 格式: <内部码>.message=<映射后的外部消息>
#   - target 不配 → 外部码=内部码（不做码值映射）
#   - message 不配 → 外部消息=内部原消息（不做消息映射）
# =============================================================

# --- 认证 / 授权 (0400-0499) ---
0400.target=AUTH_400
0400.message=凭证无效

0401.target=AUTH_401
0401.message=未认证，请先登录

0403.target=AUTH_403
0403.message=未登录，请先登录系统

0404.target=AUTH_403
0404.message=无权限，请联系管理员

0405.target=AUTH_403
0405.message=禁止访问

0406.target=AUTH_401
0406.message=会话已过期，请重新登录

# --- 通用系统错误 (1000-1999) ---
1000.target=SYS_500
1000.message=系统内部错误，请稍后重试

1001.target=VAL_400
1001.message=请求参数缺失

1002.target=VAL_400
1002.message=请求参数不合法

1003.target=BIZ_404
1003.message=请求的资源不存在

1006.target=SYS_500
1006.message=数据库操作失败

# --- 严重系统错误 (9000-9999) ---
9999.target=SYS_500
9999.message=数据库异常
